name: 产品任务清单条目
description: 添加功能、非功能需求、Bug、技术事项或待确认问题
title: "[Backlog] "
body:
  - type: markdown
    attributes:
      value: |
        产品任务清单会持续完善并按重要程度排序。不要在创建条目时预先指定 Sprint；由团队在冲刺计划会议中选择。
  - type: dropdown
    id: item-type
    attributes:
      label: 条目类型
      options:
        - 功能需求或用户故事
        - 非功能需求
        - Bug
        - 新技术或平台支持
        - 待回答的问题
        - 未来可能增加的功能
    validations:
      required: true
  - type: textarea
    id: story-or-problem
    attributes:
      label: 需求、故事或问题
      description: 用户故事可以使用“作为……我希望……从而……”，技术或问题类条目应写清需要回答的内容。
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: 描述
      description: 说明范围、背景和必要约束，不在此处预先拆分 Sprint 任务。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 预期结果或验收依据
      description: 功能需求填写可验证结果；探索事项填写预期得到的证据和结论。
      placeholder: |
        - [ ] 预期结果一
        - [ ] 预期结果二
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: 当前优先级
      options:
        - P0 - 最小闭环所必需
        - P1 - 核心增强
        - P2 - 探索性或远期
    validations:
      required: true
  - type: input
    id: issuer
    attributes:
      label: 提出人
      description: 填写提出该条目的成员、用户或会议来源。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与风险
      description: 包括权限、数据、隐私、平台或模型效果风险；没有则写“无”。
    validations:
      required: true
