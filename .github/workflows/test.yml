name: test

on:
  pull_request:
  push:
    branches: [master]

jobs:
  contracts:
    name: 附件交接契约 v0.3.1 + v0.3 回归
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r contracts/requirements-dev.txt
      - run: python contracts/build_v031_bundle.py --check
      - run: python contracts/check_v031_examples.py
      - run: python contracts/check_v03_examples.py
      - run: python -m contracts.public_import --check
      - run: python -m contracts.task_relations --check
      - run: python -m unittest discover -s contracts/tests -p 'test_*.py' -v

  text:
    name: 文本识别 ddl_text (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -r ddl_text/media_test_requirements.txt -r ddl_text/teaching_requirements.txt
      - run: python -m unittest discover -s ddl_text/tests -t . -q

  app:
    name: 前端 frontend + 后端 server (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 20.19.0  # frontend/.nvmrc
          - os: windows-latest
            node: 24  # same major version as the integration owner's Windows machine
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # backend validators use zoneinfo; Windows has no IANA time zone database
      - run: python -m pip install -r ../server/requirements.txt -r ../server/requirements-test.txt -r ../ddl_text/media_test_requirements.txt -r ../ddl_text/teaching_requirements.txt
      - name: Backend integration tests (synthetic services)
        working-directory: .
        run: python -m unittest discover -s server -p 'test_*.py' -q
      - run: npm ci
      - run: npm test
      - run: npm run build

  crawler:
    name: 爬虫 crawler (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: windows-latest
            node: 24  # same major version as the integration owner's Windows machine
          - os: windows-latest
            node: 24.14.0  # exact environment of the consecutive PDF crash reported in #127
    defaults:
      run:
        working-directory: crawler
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Producer tests call Python v0.2/v0.4 schema and semantic validators on Windows/Linux.
      - run: python -m pip install -r ../contracts/requirements-teaching-dev.txt
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: crawler/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
