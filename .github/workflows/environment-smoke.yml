name: environment-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  container-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r server/requirements-test.txt
      - name: Build exact candidate images (no application secrets)
        shell: bash
        run: |
          set -euo pipefail
          revision=$(git rev-parse HEAD)
          docker build --build-arg NIUMA_BUILD_REVISION="$revision" -f server/deploy/Dockerfile --target api -t niuma-smoke-api:candidate .
          docker build --build-arg NIUMA_BUILD_REVISION="$revision" -f server/deploy/Dockerfile --target web -t niuma-smoke-web:candidate .
          docker build --build-arg NIUMA_BUILD_REVISION="$revision" -f server/deploy/Dockerfile --target web-eci -t niuma-smoke-web-ip:candidate .
      - name: Verify HTTP/HTTPS, isolation, persistence and version identity
        env:
          NIUMA_CONTAINER_TEST_API: niuma-smoke-api:candidate
          NIUMA_CONTAINER_TEST_WEB_IP: niuma-smoke-web-ip:candidate
          NIUMA_CONTAINER_TEST_WEB_HTTPS: niuma-smoke-web:candidate
        run: python -m unittest discover -s server -p test_container_environment.py -v
