services:
  api:
    labels:
      niuma.transport: http
    image: ${API_IMAGE:-niuma-manager-api:local}
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
      target: api
      args:
        NIUMA_BUILD_REVISION: ${NIUMA_BUILD_REVISION:-unknown}
    restart: unless-stopped
    init: true
    env_file:
      - ${NIUMA_MODEL_ENV_FILE:-.env.model}
      # Compose >= 2.24: old deployments may not have mail settings yet.
      - path: ${NIUMA_MAIL_ENV_FILE:-.env.mail}
        required: false
    environment:
      NIUMA_HOST: 127.0.0.1
      NIUMA_ENVIRONMENT: ${NIUMA_ENVIRONMENT:-production}
      NIUMA_DB: /data/niuma.sqlite3
      NIUMA_PORT: '1332'
      NIUMA_MODEL_ENV: /run/niuma/no-model-file
      NIUMA_BACKGROUND_RECOVERY: ${NIUMA_BACKGROUND_RECOVERY:-0}
      NIUMA_ENABLE_SCHEDULED_SYNC: ${NIUMA_ENABLE_SCHEDULED_SYNC:-0}
      NIUMA_EMAIL_CONCURRENCY: ${NIUMA_EMAIL_CONCURRENCY:-2}
      NIUMA_EMAIL_GLOBAL_CONCURRENCY: ${NIUMA_EMAIL_GLOBAL_CONCURRENCY:-8}
      NIUMA_EMAIL_MAX_JOBS: ${NIUMA_EMAIL_MAX_JOBS:-60}
      NIUMA_EMAIL_IMAP_CONCURRENCY: ${NIUMA_EMAIL_IMAP_CONCURRENCY:-4}
      NIUMA_EMAIL_PREFETCH: ${NIUMA_EMAIL_PREFETCH:-16}
      NIUMA_EMAIL_PREFETCH_BYTES: ${NIUMA_EMAIL_PREFETCH_BYTES:-2097152}
      NIUMA_MODEL_REQUESTS_PER_MINUTE: ${NIUMA_MODEL_REQUESTS_PER_MINUTE:-0}
      NIUMA_MODEL_TOKENS_PER_MINUTE: ${NIUMA_MODEL_TOKENS_PER_MINUTE:-0}
      NIUMA_ADOPT_EXISTING_DATA: ${NIUMA_ADOPT_EXISTING_DATA:-0}
      NIUMA_ENABLE_WECHAT: '0'
      NIUMA_ENABLE_MANUAL_MATERIALS: '1'
      NIUMA_ALLOWED_ORIGINS: ${APP_ORIGIN:?Set the complete HTTP IP origin}
      NIUMA_COOKIE_SECURE: '0'
      # Only Caddy can reach this loopback API; it replaces the client IP header.
      NIUMA_TRUST_PROXY_CLIENT_IP: '1'
    ports:
      - ${HTTP_PORT:-1331}:1331
    volumes:
      - app-data:/data
    shm_size: 256mb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1332/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
  web:
    labels:
      niuma.transport: http
    image: ${WEB_IMAGE:-niuma-manager-web-ip:local}
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
      target: web-eci
      args:
        NIUMA_BUILD_REVISION: ${NIUMA_BUILD_REVISION:-unknown}
    network_mode: service:api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  app-data:
    name: ${NIUMA_DATA_VOLUME:-niuma-app-data}
    external: ${NIUMA_DATA_VOLUME_EXTERNAL:-false}
