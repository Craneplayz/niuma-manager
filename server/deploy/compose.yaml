services:
  api:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
      target: api
    restart: unless-stopped
    init: true
    env_file:
      - .env.model
    environment:
      NIUMA_ALLOWED_ORIGINS: ${APP_ORIGIN:?Set the public HTTPS origin}
      NIUMA_COOKIE_SECURE: ${COOKIE_SECURE:-1}
    volumes:
      - app-data:/data
    shm_size: 256mb
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:1332/api/health', timeout=5).read()"]
      interval: 15s
      timeout: 6s
      retries: 5
      start_period: 20s
  web:
    build:
      context: ../..
      dockerfile: server/deploy/Dockerfile
      target: web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set the public domain}
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - tls-data:/data
      - tls-config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  app-data:
  tls-data:
  tls-config:
